# Construit l'extension et la publie dans une Release GitHub.
#
# Déclenchement : pousser un tag de version, par exemple
#   git tag v0.2.0 && git push origin v0.2.0
# ou lancer le workflow à la main (onglet Actions → Release → Run workflow).
#
# Résultat : une Release avec sign-search-<version>.zip et sign-search.zip
# (ce dernier toujours au même nom, pour le lien « dernière version »).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: npm test

      - name: Lire la version du manifest
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version du manifest : $VERSION"

      - name: Vérifier que le tag correspond au manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Le tag v$TAG ne correspond pas à la version du manifest (${{ steps.version.outputs.version }}). Mettez à jour manifest.json et package.json."
            exit 1
          fi

      - name: Construire le zip
        run: |
          npm run zip
          cp sign-search.zip "sign-search-${{ steps.version.outputs.version }}.zip"
          unzip -l sign-search.zip

      - name: Publier la Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          NOTES="Installation : téléchargez sign-search.zip, décompressez-le, puis dans brave://extensions (ou chrome://extensions) activez le Mode développeur et cliquez sur « Charger l'extension non empaquetée ». Détails : docs/installation.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" sign-search.zip "sign-search-$VERSION.zip" --clobber
          else
            gh release create "$TAG" sign-search.zip "sign-search-$VERSION.zip" \
              --title "Sign.com Recherche $VERSION" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
